<div class="goals-list">
  @for (goal of goals(); track goal.id) {
    <div class="goal-item surface-card-elevated">
      <div class="goal-item__header">
        <div
          class="goal-item__icon"
          [style.background]="goal.color + '20'"
          [style.color]="goal.color"
        >
          <span class="material-symbols-rounded">{{ goal.icon }}</span>
        </div>
        <div class="goal-item__title">
          <h4>{{ goal.goal }}</h4>
          <span class="goal-item__activity">{{ goal.name }}</span>
        </div>
      </div>

      <div class="goal-item__progress">
        <div class="progress-bar">
          <div
            class="progress-fill"
            [style.width.%]="goal.progressPercent"
            [style.background]="goal.color"
          ></div>
        </div>
        <div class="progress-labels">
          <span class="progress-percent">{{ goal.progressPercent | number: '1.0-0' }}%</span>
          <span class="deadline">Deadline: {{ goal.goalDeadline! | relativeDate }}</span>
        </div>
      </div>
    </div>
  } @empty {
    <p class="no-goals">
      No active goals with deadlines set. Edit an activity to set a specific goal.
    </p>
  }
</div>
