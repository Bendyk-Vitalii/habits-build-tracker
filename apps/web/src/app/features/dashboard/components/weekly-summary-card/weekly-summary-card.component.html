<div class="summary-card glass-card">
  <div class="summary-card__header">
    <span class="material-symbols-rounded">bar_chart</span>
    <h3>Weekly Summary</h3>
  </div>
  <div class="summary-card__stats">
    <div class="summary-card__stat-item">
      <span class="summary-card__stat-value">{{ activities.length }}</span>
      <span class="summary-card__stat-label">Active Habits</span>
    </div>
    <div class="summary-card__stat-item">
      <span class="summary-card__stat-value">{{ totalGoalMinutes() | duration }}</span>
      <span class="summary-card__stat-label">Goal Time</span>
    </div>
    <div class="summary-card__stat-item">
      <span class="summary-card__stat-value">{{ completionRate }}%</span>
      <span class="summary-card__stat-label">Completion</span>
    </div>
  </div>
</div>
