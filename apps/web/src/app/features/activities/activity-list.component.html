<div class="activity-list__container animate-fade-in">
  <div class="activity-list__header">
    <h1>Activities</h1>
    <button mat-flat-button class="activity-list__add-button" (click)="openAddActivityDialog()">
      <mat-icon>add</mat-icon> New Activity
    </button>
  </div>

  @if (activities().length === 0) {
    <ht-empty-state
      icon="checklist"
      title="No activities yet"
      message="Start building a new habit by adding an activity."
    />
  } @else {
    <div class="activity-list__list" cdkDropList (cdkDropListDropped)="drop($event)">
      @for (activity of activities(); track activity.id) {
        <div class="activity-list__item" cdkDrag>
          <div class="activity-list__drag-handle" cdkDragHandle>
            <mat-icon>drag_indicator</mat-icon>
          </div>
          <ht-activity-card
            class="activity-list__card-wrapper"
            [routerLink]="['/activities', activity.id]"
            [activity]="activity"
            [streak]="activityStats()[activity.id!]?.streak || 0"
            [weeklyMinutes]="activityStats()[activity.id!]?.weeklyMinutes || 0"
            [weeklyGoal]="activity.weeklyGoalMinutes"
            style="cursor: pointer"
          />
        </div>
      }
    </div>
  }
</div>
