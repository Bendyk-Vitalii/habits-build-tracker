<a class="activity-card surface-card" [routerLink]="['/activities', activity.id]">
  <div class="activity-card__header">
    <div
      class="activity-card__icon"
      [style.background]="activity.color + '20'"
      [style.color]="activity.color"
    >
      <span class="material-symbols-rounded">{{ activity.icon }}</span>
    </div>
    <div class="activity-card__title">
      <h3>{{ activity.name }}</h3>
      <span class="category">{{ activity.category }}</span>
    </div>
  </div>

  <div class="activity-card__badges">
    <ht-phase-badge
      [phase]="$any(activity.currentPhase)"
      [consecutiveDays]="activity.consecutiveDays"
    />
    <ht-streak-counter [count]="streak" size="sm" />
  </div>

  <div class="activity-card__progress">
    <div class="progress-info">
      <span>Weekly Progress</span>
      <span>{{ weeklyMinutes }}m / {{ weeklyGoal }}m</span>
    </div>
    <div class="progress-bar">
      <div
        class="progress-fill"
        [style.width.%]="progressPercent"
        [style.background]="activity.color"
      ></div>
    </div>
  </div>
</a>
