<div class="session-complete">
  <div class="session-complete__celebration-glow"></div>

  <div class="session-complete__header">
    <mat-icon class="session-complete__trophy-icon">emoji_events</mat-icon>
    <h2>Session Complete! 🎉</h2>
    <p class="session-complete__topic-name">{{ data.topicName }}</p>
    <p class="session-complete__duration">{{ data.durationMinutes }} minutes of learning</p>
  </div>

  <div class="session-complete__rating-section">
    <span class="session-complete__section-label">How was this session?</span>
    <ht-star-rating [rating]="rating()" (ratingChange)="rating.set($event)" />
  </div>

  <mat-form-field appearance="outline" class="session-complete__full-width">
    <mat-label>Notes (optional)</mat-label>
    <textarea
      matInput
      [value]="notes()"
      (input)="notes.set(notesInput.value)"
      #notesInput
      rows="3"
      placeholder="What did you learn?"
    ></textarea>
  </mat-form-field>

  <div class="session-complete__actions">
    <button mat-button (click)="onSkip()">Skip</button>
    <button mat-flat-button color="primary" (click)="onSave()">Save</button>
  </div>
</div>
