@if (review(); as rev) {
  <div class="weekly-review__container animate-fade-in">
    <div class="weekly-review__header">
      <h1>Weekly Review</h1>
      <p class="weekly-review__subtitle">Week of {{ rev.weekStartDate }}</p>
    </div>
    <section class="weekly-review__stats-overview">
      <div class="weekly-review__stat-card glass-card">
        <div class="weekly-review__stat-value">{{ rev.totalSessions }}</div>
        <div class="weekly-review__stat-label">Sessions</div>
      </div>
      <div class="weekly-review__stat-card glass-card">
        <div class="weekly-review__stat-value">{{ rev.totalMinutes }}</div>
        <div class="weekly-review__stat-label">Minutes</div>
      </div>
      <div class="weekly-review__stat-card glass-card">
        <div class="weekly-review__stat-value">{{ completionRate() | number: '1.0-0' }}%</div>
        <div class="weekly-review__stat-label">Completion</div>
      </div>
    </section>
    <section class="weekly-review__ai-section">
      <ht-ai-insight-card />
    </section>
    <section class="weekly-review__reflection-section glass-card">
      <h3>Reflection</h3>
      <mat-form-field appearance="outline" class="weekly-review__full-width">
        <mat-label>What went well this week?</mat-label>
        <textarea
          matInput
          rows="4"
          [ngModel]="notesWell()"
          (ngModelChange)="notesWell.set($event)"
          placeholder="E.g., I was very consistent with morning coding."
        ></textarea>
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        class="weekly-review__full-width weekly-review__full-width--spaced"
      >
        <mat-label>What could be improved?</mat-label>
        <textarea
          matInput
          rows="4"
          [ngModel]="notesImprove()"
          (ngModelChange)="notesImprove.set($event)"
          placeholder="E.g., Missed some evening reading sessions due to tiredness."
        ></textarea>
      </mat-form-field>
      <button
        mat-flat-button
        color="primary"
        class="weekly-review__save-btn"
        [disabled]="isSaving()"
        (click)="saveReview()"
      >
        {{ isSaving() ? 'Saving...' : 'Save Review' }}
      </button>
    </section>
  </div>
}
