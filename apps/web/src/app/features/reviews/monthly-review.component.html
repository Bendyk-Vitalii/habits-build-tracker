@if (review(); as rev) {
  <div class="monthly-review__container animate-fade-in">
    <div class="monthly-review__header">
      <h1>Monthly Review</h1>
      <p class="monthly-review__subtitle">Month: {{ rev.month }}</p>
    </div>
    <section class="monthly-review__stats-overview">
      <div class="monthly-review__stat-card glass-card">
        <div class="monthly-review__stat-value">{{ rev.totalSessions }}</div>
        <div class="monthly-review__stat-label">Sessions</div>
      </div>
      <div class="monthly-review__stat-card glass-card">
        <div class="monthly-review__stat-value">{{ rev.totalMinutes }}</div>
        <div class="monthly-review__stat-label">Minutes</div>
      </div>
      <div class="monthly-review__stat-card glass-card">
        <div class="monthly-review__stat-value">{{ rev.phaseTransitions }}</div>
        <div class="monthly-review__stat-label">Phase Ups</div>
      </div>
    </section>
    <section class="monthly-review__reflection-section glass-card">
      <h3>Monthly Reflection</h3>
      <mat-form-field appearance="outline" class="monthly-review__full-width">
        <mat-label>Overall thoughts on this month</mat-label>
        <textarea
          matInput
          rows="6"
          [ngModel]="notes()"
          (ngModelChange)="notes.set($event)"
          placeholder="Reflect on your overall progress..."
        ></textarea>
      </mat-form-field>
      <button
        mat-flat-button
        color="primary"
        class="monthly-review__save-btn"
        [disabled]="isSaving()"
        (click)="saveReview()"
      >
        {{ isSaving() ? 'Saving...' : 'Save Review' }}
      </button>
    </section>
  </div>
}
