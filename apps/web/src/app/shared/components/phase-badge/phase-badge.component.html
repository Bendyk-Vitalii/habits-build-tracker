<div class="phase-badge" [class]="phaseClass()">
  <span class="phase-badge__emoji">{{ definition().emoji }}</span>
  <span class="phase-badge__label">{{ definition().label }}</span>
  @if (showProgress()) {
    <div class="phase-badge__progress">
      <div class="phase-badge__progress-fill" [style.width.%]="progress()"></div>
    </div>
  }
</div>
